
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-config-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-config-app
  template:
    metadata:
      labels:
        app: nginx-config-app
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: nginx-config
