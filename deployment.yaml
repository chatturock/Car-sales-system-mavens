
apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-sales-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car-sales-system
  template:
    metadata:
      labels:
        app: car-sales-system
    spec:
      containers:
        - name: car-sales-system
          image: chattanathana/car-sales-system-kubernetes:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: car-sales-system-service
spec:
  type: NodePort
  selector:
    app: car-sales-system
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30007
